name: Applimation
description: Applimation was a provider of application Information Lifecycle Management (ILM) and enterprise
  data archiving software for packaged applications including SAP (ERP, HR, CRM, SRM, SCM, APO) and Oracle
  environments, helping customers manage the full data lifecycle from test-data management through archiving
  of inactive data to lower storage and database costs and improve application performance. Informatica
  acquired Applimation for approximately $40 million in an agreement announced in February 2009, folding
  its ILM and database-archiving technology into Informatica's data management portfolio. Applimation
  no longer operates as an independent company and publishes no developer surface, API, or documentation.
